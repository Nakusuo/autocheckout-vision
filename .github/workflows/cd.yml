name: CD

# Despliegue continuo. Solo corre cuando el CI terminó en verde sobre un push a main
# (o a mano desde la pestaña Actions, solo sobre main). Así nunca se publica un commit que no
# pasó las pruebas.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Mínimos permisos: nada por defecto; cada job pide solo lo suyo.
permissions: {}

# Un despliegue a la vez; si llega otro, espera (no se cancela uno a medias).
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  imagenes:
    name: Publicar ${{ matrix.servicio }} en GHCR
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [kiosk-api, mock-gateway, kiosk-ui]
    steps:
      - uses: actions/checkout@v7
        with:
          # El commit exacto que pasó el CI, no el último de main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: imagen
        run: echo "nombre=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autocaja-${{ matrix.servicio }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.servicio }}/Dockerfile
          push: true
          # Etiqueta inmutable (sha del commit) para poder volver atrás, y latest para el quiosco.
          tags: |
            ${{ steps.imagen.outputs.nombre }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ steps.imagen.outputs.nombre }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  pasarela:
    name: Desplegar la pasarela en Render
    needs: imagenes
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ vars.PASARELA_URL }}
    steps:
      - name: Disparar el despliegue (deploy hook)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Falta el secreto RENDER_DEPLOY_HOOK_URL: no se desplegó (ver docs/CLOUD_DEVOPS.md)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Despliegue solicitado a Render"
      - name: Verificar que responde con el commit probado (/health)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          URL: ${{ vars.PASARELA_URL }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$HOOK" ] || [ -z "$URL" ]; then
            echo "::warning::Sin RENDER_DEPLOY_HOOK_URL o PASARELA_URL: no se verifica"
            exit 0
          fi
          # Render tarda en construir y el plan gratuito arranca en frío: hasta ~10 min.
          # Mientras tanto responde la versión anterior: se espera a que /health traiga este commit.
          for _ in $(seq 1 40); do
            if curl -fsS "$URL/health" | grep -q "\"revision\":\"$SHA\""; then
              echo "La pasarela responde en $URL con el commit $SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$URL/health no respondió con el commit $SHA (¿Render desplegó otro commit?)"
          exit 1

  # Quiosco completo (API + reconocimiento + interfaz) en Cloud Run, dentro del nivel gratuito.
  # Preparación única: deploy/nube/preparar_gcp.sh. Sin las variables GCP_* se salta con un aviso.
  cloudrun:
    name: Desplegar el quiosco en Cloud Run
    needs: imagenes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # GitHub se identifica ante Google sin claves guardadas (Workload Identity)
    env:
      PROYECTO: ${{ vars.GCP_PROYECTO }}
      REGION: us-central1
      IMAGEN: us-central1-docker.pkg.dev/${{ vars.GCP_PROYECTO }}/autocaja/kiosk
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: ¿Está configurado?
        id: listo
        run: |
          if [ -z "${{ vars.GCP_PROYECTO }}" ] || [ -z "${{ vars.GCP_WIF_PROVIDER }}" ] || [ -z "${{ vars.GCP_SA_DEPLOY }}" ]; then
            echo "::warning::Faltan las variables GCP_PROYECTO, GCP_WIF_PROVIDER o GCP_SA_DEPLOY: no se desplegó (ver docs/NUBE.md)"
            echo "si=no" >> "$GITHUB_OUTPUT"
          else
            echo "si=si" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.listo.outputs.si == 'si'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - if: steps.listo.outputs.si == 'si'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_DEPLOY }}
      - if: steps.listo.outputs.si == 'si'
        uses: google-github-actions/setup-gcloud@v2
      - name: Construir y subir la imagen (Artifact Registry guarda solo las 2 últimas)
        if: steps.listo.outputs.si == 'si'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f deploy/nube/Dockerfile -t "$IMAGEN:$SHA" .
          docker push "$IMAGEN:$SHA"
      - name: Desplegar con los topes de costo
        if: steps.listo.outputs.si == 'si'
        # Topes para no salir del nivel gratuito:
        #   --max-instances 1 / --min-instances 0: una sola copia (las alertas no se reparten) y
        #     cero copias sin visitas (no se cobra nada mientras duerme).
        #   --cpu-throttling: CPU solo mientras atiende una petición (facturación por petición).
        #   512 MiB y 1 vCPU: medido ~240 MB reconociendo; el gratis da ~200 h de memoria y ~50 h
        #     de CPU activa al mes.
        run: |
          gcloud run deploy autocaja \
            --image "$IMAGEN:$SHA" --region "$REGION" --project "$PROYECTO" \
            --allow-unauthenticated \
            --max-instances 1 --min-instances 0 --cpu-throttling \
            --cpu 1 --memory 512Mi --concurrency 40 --timeout 3600 \
            --service-account "autocaja-run@$PROYECTO.iam.gserviceaccount.com" \
            --set-env-vars "HF_MODELOS=Nakusuo/autocaja-modelos" \
            --set-secrets "KIOSK_CAJA_KEY=kiosk-caja-key:latest,KIOSK_NOTIFIER_KEY=kiosk-notifier-key:latest,HF_TOKEN=hf-token:latest" \
            --quiet
          URL="$(gcloud run services describe autocaja --region "$REGION" --project "$PROYECTO" --format='value(status.url)')"
          echo "### Quiosco: $URL · Caja: $URL/ayuda" >> "$GITHUB_STEP_SUMMARY"
      - name: Verificar que responde
        if: steps.listo.outputs.si == 'si'
        run: |
          URL="$(gcloud run services describe autocaja --region "$REGION" --project "$PROYECTO" --format='value(status.url)')"
          # El primer arranque baja los modelos: puede tardar ~1 min.
          for _ in $(seq 1 20); do
            if curl -fsS "$URL/api/state" > /dev/null; then echo "Responde en $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::$URL no respondió"; exit 1
