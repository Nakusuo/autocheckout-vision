name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  kiosk-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,vision]"
      - run: ruff check .
      - run: bandit -r src -q
      - run: mypy src
      # Cobertura de ramas mínima del 90 % (hoy ~95 %)
      - run: python -m pytest -q --cov=kiosk --cov-branch --cov-report=term --cov-fail-under=90

  kiosk-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kiosk-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --audit-level=high

  mock-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: bandit -r src -q
      - run: python -m pytest -q

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: bandit -r src -q
      - run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kiosk-ui/package-lock.json
      - run: pip install -e ./kiosk-api -e ./mock-gateway
      - run: npm ci
        working-directory: kiosk-ui
      - run: npx playwright install --with-deps chromium
        working-directory: kiosk-ui
      - run: npm run e2e
        working-directory: kiosk-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            kiosk-ui/playwright-report
            kiosk-ui/test-results
          retention-days: 7

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
