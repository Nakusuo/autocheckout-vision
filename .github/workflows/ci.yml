name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  kiosk-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,vision]"
      - run: ruff check .
      - run: bandit -c pyproject.toml -r . -q
      - run: mypy src
      # Cobertura de ramas mínima del 90 % (hoy ~95 %)
      - run: python -m pytest -q --cov=kiosk --cov-branch --cov-report=term --cov-fail-under=90

  kiosk-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kiosk-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --audit-level=high

  mock-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: bandit -c pyproject.toml -r . -q
      - run: python -m pytest -q

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: bandit -c pyproject.toml -r . -q
      - run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kiosk-ui/package-lock.json
      - run: pip install -e ./kiosk-api -e ./mock-gateway
      - run: npm ci
        working-directory: kiosk-ui
      - run: npx playwright install --with-deps chromium
        working-directory: kiosk-ui
      - run: npm run e2e
        working-directory: kiosk-ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            kiosk-ui/playwright-report
            kiosk-ui/test-results
          retention-days: 7

  # Construye las tres imágenes, levanta el stack con docker compose y recorre una compra
  # completa (interfaz → API → pasarela TLS 1.3 → ticket). Si esto pasa, el CD puede publicar.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Clave de prueba (solo para este job)
        run: echo "GATEWAY_API_KEY=ci-$(openssl rand -hex 24)" > .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - name: Prueba de humo (pago con QR)
        run: |
          docker compose cp mock-gateway:/app/keys/ca.pem "$RUNNER_TEMP/ca.pem"
          python3 ops/smoke_compose.py --ca "$RUNNER_TEMP/ca.pem"
      - name: Prueba de humo (pago con Yape, API de Mercado Pago imitada)
        run: |
          KIOSK_PAYMENT=yape docker compose up -d --wait --wait-timeout 120 kiosk-api kiosk-ui
          python3 ops/smoke_compose.py --ca "$RUNNER_TEMP/ca.pem" --pago yape
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
