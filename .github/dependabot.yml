version: 2
updates:
  - package-ecosystem: pip
    directory: /kiosk-api
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /mock-gateway
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: npm
    directory: /kiosk-ui
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      dependencias-de-desarrollo:
        dependency-type: development
    ignore:
      # Stryker 10 usa la API de TypeScript en JS, que TypeScript 7 (nativo) ya no trae.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
