[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kiosk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7", "mypy>=1.10", "httpx>=0.27"]
vision = ["numpy>=1.26", "opencv-python-headless>=4.9", "onnxruntime>=1.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
# Pruebas de mutación (solo Linux: corre en .github/workflows/mutation.yml).
# Se copia todo el paquete (las pruebas importan los demás módulos) y se mutan solo tres.
source_paths = ["src/"]
do_not_mutate = [
    "src/kiosk/__init__.py", "src/kiosk/__main__.py", "src/kiosk/app.py", "src/kiosk/catalog.py",
    "src/kiosk/metrics.py", "src/kiosk/payments.py", "src/kiosk/pos.py", "src/kiosk/recognizer.py",
    "src/kiosk/scale.py", "src/kiosk/stability.py", "src/kiosk/store.py", "src/kiosk/tray.py",
    "src/kiosk/vision.py",
]
# Fuera: las que leen archivos del repo o dependen de tiempos reales
pytest_add_cli_args = [
    "--ignore=tests/test_catalog.py",
    "--ignore=tests/test_cli.py",
    "--ignore=tests/test_integration.py",
]

[tool.mypy]
ignore_missing_imports = true  # cv2 y onnxruntime no traen tipos

[tool.ruff]
line-length = 100
