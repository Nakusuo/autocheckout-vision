# Modo cámara (Linux, webcam en /dev/video0).
#   docker compose -f docker-compose.yml -f docker-compose.camara.yml up --build
#
# Requiere en ml/data/models/: dinov2-small.onnx, silueta.onnx y galeria.npz
# (ver docs/ml/reconocimiento.md). En .env:
#   VIDEO_GID=<número del grupo video>   →  getent group video | cut -d: -f3
#   HOST_UID / HOST_GID                   →  id -u / id -g (por defecto 1000)
# El nombre «video» dentro del contenedor tiene otro número que en el equipo (44 en Debian),
# por eso se usa el número: con el nombre, OpenCV no puede abrir la cámara.
services:
  kiosk-api:
    build:
      args:
        EXTRAS: vision
    image: ${AUTOCAJA_IMAGEN:-autocaja}-kiosk-api-vision:${AUTOCAJA_VERSION:-local}
    # Tu usuario: así las fotos que guarda `capturar` en ml/data/raw quedan a tu nombre.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      KIOSK_MODE: camera
      KIOSK_GALLERY: /app/ml/data/models/galeria.npz
      KIOSK_CAMERA: ${KIOSK_CAMERA:-0}
      HOME: /tmp
      # Opcionales (descomenta): zona de escaneo y umbral de parecido
      # KIOSK_ZONE: "0.25,0.1,0.75,0.9"
      # KIOSK_THRESHOLD: "0.6"
    devices:
      - /dev/video0:/dev/video0
    group_add:
      - "${VIDEO_GID:?Define VIDEO_GID en .env: getent group video | cut -d: -f3}"
    volumes:
      - ./ml/data:/app/ml/data
